name: Rubirinth App release
on:
  workflow_run:
    workflows: ['Rubirinth App build']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod' }}

jobs:
  release:
    name: Release Rubirinth App
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ github.event.workflow_run.head_branch }}
      WINDOWS_X64_BUNDLE_ARTIFACT_NAME: App bundle (x86_64-pc-windows-msvc)

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify ref is a tag
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag_sha=$(gh api "repos/${{ github.repository }}/git/refs/tags/${VERSION_TAG}" --jq '.object.sha' 2>/dev/null || true)
          if [ -z "$tag_sha" ]; then
            echo "::error::${VERSION_TAG} is not a git tag in this repo"
            exit 1
          fi

      - name: Download Rubirinth App artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WINDOWS_X64_BUNDLE_ARTIFACT_NAME }}
          path: windows-bundle

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION_TAG#v}"

          # Fetch latest upstream Modrinth App version
          UPSTREAM_VERSION=$(gh api "repos/modrinth/theseus/releases/latest" --jq '.tag_name' 2>/dev/null | sed 's/^v//' || echo "")

          if [ -n "$UPSTREAM_VERSION" ]; then
            RELEASE_TITLE="Rubirinth App ${VERSION} (based on Modrinth App ${UPSTREAM_VERSION})"
          else
            RELEASE_TITLE="Rubirinth App ${VERSION}"
          fi

          echo "Creating release with title: $RELEASE_TITLE"

          gh release create "$VERSION_TAG" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            windows-bundle/*-setup.exe
