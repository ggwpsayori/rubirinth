name: Rubirinth App build
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      sign-windows-binaries:
        description: Sign Windows binaries
        type: boolean
        default: false
        required: false
      environment:
        description: Environment
        type: choice
        options:
          - prod
          - staging
          - prod-with-staging-archon
        default: prod
        required: false
      app-version-override:
        description: Temporary app version override for updater testing
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod' }}

jobs:
  build:
    name: Build Windows
    permissions:
      contents: write
    env:
      VITE_STRIPE_PUBLISHABLE_KEY: pk_live_51JbFxJJygY5LJFfKLVVldb10HlLt24p421OWRsTOWc5sXYFOnFUXWieSc6HD3PHo25ktx8db1WcHr36XGFvZFVUz00V9ixrCs5
      RUSTC_WRAPPER: 'sccache'

    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Dasel
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: TomWright/dasel
          tag: v2.8.1
          extension-matching: disable
          rename-to: dasel.exe
          chmod: 0755

      - name: Generate tauri-dev.conf.json
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cat > apps/app/tauri-dev.conf.json <<EOF
          {
            "productName": "Rubirinth App (dev-${GIT_HASH})",
            "mainBinaryName": "RubirinthApp-dev-${GIT_HASH}",
            "identifier": "RubirinthApp-dev-${GIT_HASH}",
            "bundle": {
              "fileAssociations": []
            }
          }
          EOF

      - name: Set application version and environment
        shell: bash
        run: |
          APP_VERSION="${{ inputs.app-version-override }}"
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="$(git describe --tags --always | sed -E 's/-([0-9]+)-(g[0-9a-fA-F]+)$/-canary+\1.\2/')"
          fi
          BUILD_ENVIRONMENT="${{ inputs.environment || 'prod' }}"
          echo "Setting application version to $APP_VERSION"
          echo "Using environment $BUILD_ENVIRONMENT"
          dasel put -f apps/app/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f packages/app-lib/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f apps/app-frontend/package.json -t string -v "${APP_VERSION#v}" 'version'

          cp "packages/app-lib/.env.${BUILD_ENVIRONMENT}" packages/app-lib/.env

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows app
        run: |
          if ($env:DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64) {
            [System.Convert]::FromBase64String("$env:DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64") | Set-Content -Path signer-client-cert.p12 -AsByteStream
            $env:DIGICERT_ONE_SIGNER_CREDENTIALS = "$env:DIGICERT_ONE_SIGNER_API_KEY|$PWD\signer-client-cert.p12|$env:DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD"
          }
          $env:JAVA_HOME = "$env:JAVA_HOME_17_X64"
          ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.app-version-override != '') && 'pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json --verbose --bundles "nsis"' || 'pnpm --filter=@modrinth/app run tauri build --config tauri-dev.conf.json --verbose --bundles "nsis"' }}
          Remove-Item -Path signer-client-cert.p12 -ErrorAction SilentlyContinue
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          DIGICERT_ONE_SIGNER_API_KEY: ${{ secrets.DIGICERT_ONE_SIGNER_API_KEY }}
          DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64: ${{ secrets.DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_BASE64 }}
          DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD: ${{ secrets.DIGICERT_ONE_SIGNER_CLIENT_CERTIFICATE_PASSWORD }}

      - name: Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: App bundle (x86_64-pc-windows-msvc)
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.nsis.zip*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          VERSION="${VERSION_TAG#v}"

          # Fetch latest upstream Modrinth App version
          UPSTREAM_VERSION=$(gh api "repos/modrinth/theseus/releases/latest" --jq '.tag_name' 2>/dev/null | sed 's/^v//' || echo "")

          if [ -n "$UPSTREAM_VERSION" ]; then
            RELEASE_TITLE="Rubirinth App ${VERSION} (based on Modrinth App ${UPSTREAM_VERSION})"
          else
            RELEASE_TITLE="Rubirinth App ${VERSION}"
          fi

          # Clean up any accidental 'main' release
          gh release delete main --yes 2>/dev/null || true

          NOTES_ARG="--generate-notes"
          NOTES_FILE=""
          if [ -f "release-notes/${RELEASE_TITLE}.md" ]; then
            NOTES_FILE="release-notes/${RELEASE_TITLE}.md"
          else
            MATCHING_FILE=$(ls release-notes/Rubirinth\ App\ ${VERSION}*.md 2>/dev/null | head -n 1 || true)
            if [ -n "$MATCHING_FILE" ] && [ -f "$MATCHING_FILE" ]; then
              NOTES_FILE="$MATCHING_FILE"
            elif [ -f "release-notes/${VERSION_TAG}.md" ]; then
              NOTES_FILE="release-notes/${VERSION_TAG}.md"
            fi
          fi

          if [ -n "$NOTES_FILE" ]; then
            NOTES_ARG="--notes-file $NOTES_FILE"
          fi

          echo "Creating GitHub Release for ${VERSION_TAG} with ${NOTES_ARG}..."
          gh release create "${VERSION_TAG}" \
            --title "${RELEASE_TITLE}" \
            ${NOTES_ARG} \
            target/release/bundle/nsis/*-setup.exe
