name: Rubirinth App build
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options:
          - prod
          - staging
          - prod-with-staging-archon
        default: prod
        required: false
      app-version-override:
        description: Temporary app version override for updater testing
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod' }}

jobs:
  build:
    name: Build (${{ matrix.artifact-target-name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-target-name: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            artifact-target-name: x86_64-unknown-linux-gnu
          - os: macos-latest
            artifact-target-name: universal-apple-darwin

    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: 'sccache'

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      - name: Add macOS compilation targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm libfuse2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Dasel
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: TomWright/dasel
          tag: v2.8.1
          extension-matching: disable
          rename-to: ${{ matrix.os == 'windows-latest' && 'dasel.exe' || 'dasel' }}
          chmod: 0755

      - name: Generate tauri-dev.conf.json
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cat > apps/app/tauri-dev.conf.json <<EOF
          {
            "productName": "Rubirinth App (dev-${GIT_HASH})",
            "mainBinaryName": "RubirinthApp-dev-${GIT_HASH}",
            "identifier": "RubirinthApp-dev-${GIT_HASH}",
            "bundle": {
              "fileAssociations": []
            }
          }
          EOF

      - name: Set application version and environment
        shell: bash
        run: |
          APP_VERSION="${{ inputs.app-version-override }}"
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="$(git describe --tags --always | sed -E 's/-([0-9]+)-(g[0-9a-fA-F]+)$/-canary+\1.\2/')"
          fi
          BUILD_ENVIRONMENT="${{ inputs.environment || 'prod' }}"
          echo "Setting application version to $APP_VERSION"
          echo "Using environment $BUILD_ENVIRONMENT"
          dasel put -f apps/app/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f packages/app-lib/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
          dasel put -f apps/app-frontend/package.json -t string -v "${APP_VERSION#v}" 'version'

          cp "packages/app-lib/.env.${BUILD_ENVIRONMENT}" packages/app-lib/.env

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows app
        if: matrix.os == 'windows-latest'
        run: |
          $env:JAVA_HOME = "$env:JAVA_HOME_17_X64"
          ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.app-version-override != '') && 'pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json --verbose --bundles "nsis"' || 'pnpm --filter=@modrinth/app run tauri build --config tauri-dev.conf.json --verbose --bundles "nsis"' }}

      - name: Build Linux app
        if: matrix.os == 'ubuntu-22.04'
        run: |
          ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.app-version-override != '') && 'pnpm --filter=@modrinth/app run tauri build --config tauri-release.conf.json --verbose --bundles "appimage,deb,rpm"' || 'pnpm --filter=@modrinth/app run tauri build --config tauri-dev.conf.json --verbose --bundles "appimage,deb,rpm"' }}

      - name: Build macOS app
        if: matrix.os == 'macos-latest'
        run: |
          ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || inputs.app-version-override != '') && 'pnpm --filter=@modrinth/app run tauri build --target universal-apple-darwin --config tauri-release.conf.json --verbose --bundles "dmg"' || 'pnpm --filter=@modrinth/app run tauri build --target universal-apple-darwin --config tauri-dev.conf.json --verbose --bundles "dmg"' }}
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'

      - name: Upload Windows bundle
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: App bundle (windows)
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.nsis.zip*

      - name: Upload Linux bundle
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: App bundle (linux)
          path: |
            target/release/bundle/appimage/*
            target/release/bundle/deb/*
            target/release/bundle/rpm/*

      - name: Upload macOS bundle
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: App bundle (macos)
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all app bundles
        uses: actions/download-artifact@v4
        with:
          pattern: 'App bundle (*)'
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          VERSION="${VERSION_TAG#v}"

          # Fetch latest upstream Modrinth App version
          UPSTREAM_VERSION=$(gh api "repos/modrinth/theseus/releases/latest" --jq '.tag_name' 2>/dev/null | sed 's/^v//' || echo "")

          if [ -n "$UPSTREAM_VERSION" ]; then
            RELEASE_TITLE="Rubirinth App ${VERSION} (based on Modrinth App ${UPSTREAM_VERSION})"
          else
            RELEASE_TITLE="Rubirinth App ${VERSION}"
          fi

          # Clean up any accidental 'main' release
          gh release delete main --yes 2>/dev/null || true

          NOTES_FILE=""
          if [ -f "release-notes/${RELEASE_TITLE}.md" ]; then
            NOTES_FILE="release-notes/${RELEASE_TITLE}.md"
          else
            MATCHING_FILE=$(ls release-notes/Rubirinth\ App\ ${VERSION}*.md 2>/dev/null | head -n 1 || true)
            if [ -n "$MATCHING_FILE" ] && [ -f "$MATCHING_FILE" ]; then
              NOTES_FILE="$MATCHING_FILE"
            elif [ -f "release-notes/${VERSION_TAG}.md" ]; then
              NOTES_FILE="release-notes/${VERSION_TAG}.md"
            fi
          fi

          echo "Downloaded release artifacts:"
          ls -la release-artifacts/

          FILES=()
          for f in release-artifacts/*; do
            if [ -f "$f" ]; then
              case "$f" in
                *.exe|*.AppImage|*.deb|*.rpm|*.dmg|*.zip)
                  FILES+=("$f")
                  ;;
              esac
            fi
          done

          echo "Files to publish: ${FILES[*]}"

          if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
            echo "Creating GitHub Release for ${VERSION_TAG} with notes file '${NOTES_FILE}'..."
            gh release create "${VERSION_TAG}" \
              --title "${RELEASE_TITLE}" \
              --notes-file "${NOTES_FILE}" \
              "${FILES[@]}"
          else
            echo "Creating GitHub Release for ${VERSION_TAG} with generated notes..."
            gh release create "${VERSION_TAG}" \
              --title "${RELEASE_TITLE}" \
              --generate-notes \
              "${FILES[@]}"
          fi
